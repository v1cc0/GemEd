[package]
name = "gemed_app"
description = "Dioxus UI shell for GemEd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["launch", "macro", "html", "signals", "hooks", "logger", "document"] }
gemed_core = { path = "../gemed_core" }
gemed_executor = { path = "../gemed_executor" }
gemed_media = { path = "../gemed_media" }
gemed_providers = { path = "../gemed_providers" }
gemed_storage = { path = "../gemed_storage", default-features = false }
rfd = { workspace = true, optional = true }
serde_json.workspace = true
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["HtmlTextAreaElement", "Location"] }

[features]
default = ["desktop"]
web = ["dioxus/web", "gemed_storage/web", "dep:wasm-bindgen", "dep:web-sys"]
desktop = ["dioxus/desktop", "gemed_storage/desktop", "dep:rfd"]
providers-http = ["gemed_providers/http"]
bundle = []
