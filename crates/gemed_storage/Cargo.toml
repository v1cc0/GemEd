[package]
name = "gemed_storage"
description = "Workflow storage contracts and platform implementations for GemEd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = { workspace = true, optional = true }
gemed_core = { path = "../gemed_core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
web-sys = { workspace = true, optional = true, features = ["Window", "Storage"] }

[features]
default = ["desktop"]
web = ["dep:web-sys"]
desktop = ["dep:directories"]
