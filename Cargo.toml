[package]
name = "gemed"
description = "GemEd - Generate Gems on Editing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[workspace]
members = [
  "crates/gemed_core",
  "crates/gemed_app",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/v1cc0/GemEd"

[workspace.dependencies]
dioxus = { version = "0.8.0-alpha.0", default-features = false }
indexmap = { version = "2.12.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2.105"
web-sys = "0.3.82"

[dependencies]
gemed_app = { path = "crates/gemed_app", default-features = false }

[features]
default = ["desktop"]
web = ["gemed_app/web"]
desktop = ["gemed_app/desktop"]
bundle = ["gemed_app/bundle"]
