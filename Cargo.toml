[package]
name = "gemed"
description = "GemEd - Generate Gems on Editing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[workspace]
members = [
  "crates/gemed_core",
  "crates/gemed_app",
  "crates/gemed_executor",
  "crates/gemed_media",
  "crates/gemed_providers",
  "crates/gemed_storage",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/v1cc0/GemEd"

[workspace.dependencies]
dioxus = { version = "0.8.0-alpha.0", default-features = false }
async-trait = "0.1.89"
base64 = "0.22.1"
directories = "6.0.0"
futures = "0.3.32"
indexmap = { version = "2.12.1", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
regex = "1.12.3"
rfd = "0.17.2"
thiserror = "2.0.18"
ureq = "3.3.0"
uuid = { version = "1.19.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2.105"
web-sys = "0.3.82"

[dependencies]
gemed_app = { path = "crates/gemed_app", default-features = false }

[features]
default = ["desktop"]
web = ["gemed_app/web"]
desktop = ["gemed_app/desktop"]
providers-http = ["gemed_app/providers-http"]
bundle = ["gemed_app/bundle"]
