name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.8.0-alpha.0

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            xdotool \
            patchelf

      - name: Format check
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy desktop
        run: cargo clippy --workspace --all-targets --features desktop -- -D warnings

      - name: Clippy web
        run: cargo clippy --workspace --all-targets --no-default-features --features web -- -D warnings

  dioxus-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web build
            os: ubuntu-latest
            target: web
            command: dx build --web --no-default-features --features web
          - name: Linux desktop build
            os: ubuntu-latest
            target: linux-desktop
            command: dx build --desktop --features desktop
          - name: Windows desktop build
            os: windows-latest
            target: windows-desktop
            command: dx build --desktop --features desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Add WASM target
        if: matrix.target == 'web'
        run: rustup target add wasm32-unknown-unknown

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux-desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            xdotool \
            patchelf

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Build
        run: ${{ matrix.command }}
