name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_webview_smoke:
        description: "Run the Windows WebView2 desktop self-smoke"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.8.0-alpha.0

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            xdotool \
            patchelf

      - name: Format check
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Test desktop provider HTTP feature
        run: cargo test --workspace --features desktop,providers-http

      - name: Clippy desktop
        run: cargo clippy --workspace --all-targets --features desktop -- -D warnings

      - name: Clippy web
        run: cargo clippy --workspace --all-targets --no-default-features --features web -- -D warnings

      - name: Clippy desktop provider HTTP feature
        run: cargo clippy --workspace --all-targets --features desktop,providers-http -- -D warnings

  web-interaction-smoke:
    name: Web interaction smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Prepare isolated Playwright harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gemed-pw-smoke"
          cd "$RUNNER_TEMP/gemed-pw-smoke"
          npm init -y
          npm install @playwright/test@1.60.0
          npx playwright install --with-deps chromium
          cat > capture-click.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';

          const baseUrl = process.env.GEMED_SMOKE_URL ?? 'http://127.0.0.1:4564/';

          test.use({
            launchOptions: {
              args: ['--use-angle=swiftshader', '--ignore-gpu-blocklist'],
            },
          });

          test('Run Local streams execution events into the Execution Spine', async ({ page }) => {
            test.setTimeout(60000);
            await page.goto(baseUrl);
            await page.getByRole('button', { name: 'Sample', exact: true }).click();
            await page.getByRole('button', { name: 'Run Local' }).click();
            await expect(page.getByText(/Local executor finished: 2 complete, 1 skipped, 0 errors/)).toBeVisible({ timeout: 45000 });
            await expect(page.getByText('Last run: 2 complete, 1 skipped, 0 errors')).toBeVisible();
            await expect(page.locator('.execution-log .event').filter({ hasText: 'loading' })).toHaveCount(3);
            await expect(page.locator('.execution-log .event').filter({ hasText: 'complete' })).toHaveCount(2);
            await expect(page.locator('.execution-log .event').filter({ hasText: 'skipped' })).toHaveCount(1);
          });

          test('Mock provider run streams provider execution events and outputs', async ({ page }) => {
            test.setTimeout(60000);
            await page.goto(baseUrl);
            await page.getByRole('button', { name: 'Provider Sample' }).click();
            await page.getByRole('button', { name: 'Mock Defaults' }).click();
            await page.getByRole('button', { name: 'Run Providers' }).click();
            await expect(page.getByText(/Provider run finished: 7 complete, 0 skipped, 0 errors/)).toBeVisible({ timeout: 45000 });
            await expect(page.getByText('Last run: 7 complete, 0 skipped, 0 errors')).toBeVisible();
            await expect(page.locator('.execution-log .event').filter({ hasText: 'loading' })).toHaveCount(7);
            await expect(page.locator('.execution-log .event').filter({ hasText: 'complete' })).toHaveCount(7);
            await expect(page.locator('article', { hasText: 'provider_gemini_output' }).getByText(/\[mock:gemini:gemini-3\.5-flash\]/)).toBeVisible();
            await expect(page.locator('article', { hasText: 'provider_openai_output' }).getByText(/\[mock:openai:gpt-5\.5\]/)).toBeVisible();
            await expect(page.locator('article', { hasText: 'provider_anthropic_output' }).getByText(/\[mock:anthropic:claude-sonnet-4-6\]/)).toBeVisible();
          });

          test('Frame Sample capture button emits a PNG in Chromium', async ({ page }) => {
            test.setTimeout(60000);
            await page.goto(baseUrl);
            await page.getByRole('button', { name: 'Frame Sample' }).click();
            await page.getByRole('button', { name: 'Run Local' }).click();
            await page.locator('article', { hasText: 'frame_grab' }).click({ position: { x: 80, y: 20 } });
            await page.getByRole('button', { name: 'Capture', exact: true }).click();
            await expect(page.getByText(/Captured frame for `frame_grab`/)).toBeVisible({ timeout: 45000 });
            await expect(page.locator('article', { hasText: 'frame_grab' }).getByText(/webview-video-canvas emitted PNG output/)).toBeVisible();
          });

          test('GLB Capture PNG button emits a PNG in Chromium', async ({ page }) => {
            test.setTimeout(90000);
            await page.goto(baseUrl);
            await page.getByRole('button', { name: 'Media Sample' }).click();
            await page.getByRole('button', { name: 'Run Local' }).click();
            await page.locator('article', { hasText: 'media_glb' }).click({ position: { x: 80, y: 20 } });
            await page.getByRole('button', { name: 'Capture PNG' }).click();
            await expect(page.getByText(/Captured GLB snapshot for `media_glb`/)).toBeVisible({ timeout: 75000 });
            await expect(page.locator('article', { hasText: 'media_glb' }).getByText(/webview-model-viewer emitted PNG snapshot/)).toBeVisible();
          });
          EOF

      - name: Start Dioxus web server
        shell: bash
        run: |
          set -euo pipefail
          dx serve --web --no-default-features --features web --open false --port 4564 --addr 127.0.0.1 --watch false --hot-patch false --hot-reload false > "$RUNNER_TEMP/gemed-dx-web-smoke.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/gemed-dx-web-smoke.pid"
          for _ in {1..120}; do
            if curl -fsS -I http://127.0.0.1:4564/ >/dev/null \
              && curl -fsS -I http://127.0.0.1:4564/vendor/model-viewer/4.3.1/model-viewer.min.js >/dev/null \
              && grep -q "Build completed successfully" "$RUNNER_TEMP/gemed-dx-web-smoke.log"; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/gemed-dx-web-smoke.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/gemed-dx-web-smoke.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/gemed-dx-web-smoke.log"
          exit 1

      - name: Run browser media interactions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gemed-pw-smoke"
          GEMED_SMOKE_URL=http://127.0.0.1:4564/ npx playwright test capture-click.spec.ts --reporter=line --browser=chromium

      - name: Stop Dioxus web server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gemed-dx-web-smoke.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/gemed-dx-web-smoke.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/gemed-dx-web-smoke.log" 2>/dev/null || true

      - name: Upload web interaction smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemed-web-interaction-smoke
          path: |
            ${{ runner.temp }}/gemed-dx-web-smoke.log
            ${{ runner.temp }}/gemed-pw-smoke/test-results
            ${{ runner.temp }}/gemed-pw-smoke/playwright-report
          if-no-files-found: warn

  dioxus-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web build
            os: ubuntu-latest
            target: web
            command: dx build --web --no-default-features --features web
          - name: Linux desktop build
            os: ubuntu-latest
            target: linux-desktop
            command: dx build --desktop --features desktop
          - name: Linux desktop providers-http build
            os: ubuntu-latest
            target: linux-desktop-providers-http
            command: dx build --desktop --features desktop,providers-http
          - name: Windows desktop build
            os: windows-latest
            target: windows-desktop
            command: dx build --desktop --features desktop
          - name: Windows desktop providers-http build
            os: windows-latest
            target: windows-desktop-providers-http
            command: dx build --desktop --features desktop,providers-http
          - name: Linux desktop bundle
            os: ubuntu-latest
            target: linux-desktop-bundle
            command: dx bundle --desktop --features desktop,bundle --package-types deb
          - name: Windows desktop bundle
            os: windows-latest
            target: windows-desktop-bundle
            command: dx bundle --desktop --features desktop,bundle --package-types msi
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Add WASM target
        if: matrix.target == 'web'
        run: rustup target add wasm32-unknown-unknown

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux-desktop' || matrix.target == 'linux-desktop-providers-http' || matrix.target == 'linux-desktop-bundle'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            xdotool \
            patchelf

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.8.0-alpha.0 --locked

      - name: Record tool versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ci-artifacts/${{ matrix.target }}" | Out-Null
          rustc -Vv | Tee-Object -FilePath "ci-artifacts/${{ matrix.target }}/rustc-version.txt"
          cargo -V | Tee-Object -FilePath "ci-artifacts/${{ matrix.target }}/cargo-version.txt"
          dx --version | Tee-Object -FilePath "ci-artifacts/${{ matrix.target }}/dioxus-version.txt"

      - name: Build
        run: ${{ matrix.command }}

      - name: Collect Dioxus build evidence
        shell: pwsh
        run: |
          $artifactDir = "ci-artifacts/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $candidateRoots = @(
            "target/dx/gemed/debug",
            "$env:HOME/.cargo/target/dx/gemed/debug",
            "$env:USERPROFILE/.cargo/target/dx/gemed/debug"
          )
          $found = $false
          foreach ($root in $candidateRoots) {
            if ($root -and (Test-Path $root)) {
              $found = $true
              $safeName = ($root -replace '[:\\/]+', '_').Trim('_')
              Copy-Item -Recurse -Force $root "$artifactDir/$safeName"
              Get-ChildItem -Recurse $root | Select-Object FullName, Length |
                Out-File "$artifactDir/${safeName}-manifest.txt"
            }
          }
          if (-not $found) {
            "No Dioxus output directory found in candidate roots." |
              Out-File "$artifactDir/no-dioxus-output-found.txt"
          }

      - name: Collect Dioxus bundle evidence
        if: contains(matrix.target, 'bundle')
        shell: pwsh
        run: |
          $artifactDir = "ci-artifacts/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $candidateRoots = @(
            "target/dx/gemed/bundle",
            "$env:HOME/.cargo/target/dx/gemed/bundle",
            "$env:USERPROFILE/.cargo/target/dx/gemed/bundle"
          )
          $found = $false
          foreach ($root in $candidateRoots) {
            if ($root -and (Test-Path $root)) {
              $found = $true
              $safeName = ($root -replace '[:\\/]+', '_').Trim('_')
              Copy-Item -Recurse -Force $root "$artifactDir/$safeName"
              Get-ChildItem -Recurse $root | Select-Object FullName, Length |
                Out-File "$artifactDir/${safeName}-bundle-manifest.txt"
            }
          }
          if (-not $found) {
            "No Dioxus bundle directory found in candidate roots." |
              Out-File "$artifactDir/no-dioxus-bundle-found.txt"
          }

      - name: Upload Dioxus build evidence
        uses: actions/upload-artifact@v4
        with:
          name: gemed-${{ matrix.target }}-dx-build
          path: ci-artifacts/${{ matrix.target }}
          if-no-files-found: warn

  windows-webview2-self-smoke:
    name: Windows desktop WebView2 self-smoke
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_webview_smoke }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Record tool versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ci-artifacts/windows-webview2-self-smoke" | Out-Null
          rustc -Vv | Tee-Object -FilePath "ci-artifacts/windows-webview2-self-smoke/rustc-version.txt"
          cargo -V | Tee-Object -FilePath "ci-artifacts/windows-webview2-self-smoke/cargo-version.txt"

      - name: Run desktop WebView2 self-smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = "ci-artifacts/windows-webview2-self-smoke"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $log = "$artifactDir/windows-webview2-self-smoke.log"
          $env:GEMED_DESKTOP_SELF_SMOKE = "1"
          cargo run --features desktop 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "Windows WebView2 self-smoke exited with code $exitCode."
            exit $exitCode
          }
          if (-not (Select-String -Path $log -Pattern "\[gemed-desktop-self-smoke\] PASS" -Quiet)) {
            Write-Error "Windows WebView2 self-smoke did not print the PASS marker."
            exit 1
          }

      - name: Upload Windows WebView2 self-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemed-windows-webview2-self-smoke
          path: ci-artifacts/windows-webview2-self-smoke
          if-no-files-found: warn
